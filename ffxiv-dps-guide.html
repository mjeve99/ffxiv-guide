<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>⚔️ FFXIV DPS 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080a12;--bg2:#10131e;--bg3:#181b2a;--bg4:#1e2236;
  --border:#252840;--border2:#3a3f60;
  --gold:#c8a64f;--gold2:#e8d070;--gold3:#8a6a20;
  --text:#cdd0e4;--text2:#8890b0;--text3:#555d80;
  --melee:#d64040;--melee2:#ff7070;--melee3:#3a1010;
  --ranged:#35a870;--ranged2:#60d890;--ranged3:#0a3020;
  --caster:#8855d0;--caster2:#bb88ff;--caster3:#22103a;
  --gcd:#2d6eb0;--ogcd:#b07020;--role:#406040;
  --combo:#2d6eb0;--buff:#286040;--party:#206070;
  --dot:#803030;--move:#205878;--survival:#7a3020;
  --aoe:#5a3090;--burst:#805020;--util:#404870;
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden}

/* Header */
.header{background:linear-gradient(180deg,#0a0c18 0%,var(--bg2) 100%);border-bottom:2px solid var(--gold3);padding:20px 24px 16px;text-align:center;position:relative}
.header::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:200px;height:2px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.header-title{font-family:'Cinzel',serif;font-size:28px;color:var(--gold);letter-spacing:3px;text-shadow:0 0 20px rgba(200,166,79,.4)}
.header-sub{color:var(--text2);font-size:13px;margin-top:6px;letter-spacing:1px}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:100}
.tab{flex:1;padding:14px 0;text-align:center;cursor:pointer;font-size:14px;font-weight:500;border-bottom:3px solid transparent;transition:all .2s;color:var(--text2);letter-spacing:.5px}
.tab:hover{color:var(--text);background:rgba(255,255,255,.03)}
.tab.active.melee{border-color:var(--melee);color:var(--melee2)}
.tab.active.ranged{border-color:var(--ranged);color:var(--ranged2)}
.tab.active.caster{border-color:var(--caster);color:var(--caster2)}

/* Layout */
.main{display:flex;height:calc(100vh - 116px);overflow:hidden}
.sidebar{width:200px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:12px 0}
.content{flex:1;overflow-y:auto;padding:20px}

/* Job Buttons */
.job-group{display:none}
.job-group.active{display:block}
.job-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;background:none;border:none;color:var(--text2);cursor:pointer;font-size:13px;font-family:'Noto Sans KR',sans-serif;transition:all .15s;border-left:3px solid transparent}
.job-btn:hover{background:rgba(255,255,255,.04);color:var(--text)}
.job-btn.active{background:rgba(255,255,255,.06);color:var(--text);border-left-color:var(--job-color)}
.job-abbr{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--bg3);padding:2px 6px;border-radius:3px;letter-spacing:1px}

/* Job Detail */
.job-panel{display:none}
.job-panel.active{display:block}
.job-header{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.job-name-big{font-family:'Cinzel',serif;font-size:22px;font-weight:700;margin-bottom:4px}
.job-desc{color:var(--text2);font-size:13px;line-height:1.6;max-width:480px}
.job-meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:500;letter-spacing:.5px}
.difficulty-stars{color:var(--gold);font-size:12px}
.guide-link{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;color:var(--gold);font-size:12px;text-decoration:none;transition:all .15s;flex-shrink:0;white-space:nowrap}
.guide-link:hover{background:rgba(200,166,79,.1);border-color:var(--gold)}

/* Mechanics */
.section-title{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.mechanics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:20px}
.mechanic-card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
.mechanic-name{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:4px}
.mechanic-desc{font-size:12px;color:var(--text2);line-height:1.5}

/* Keyboard Layout */
.kbd-section{margin-bottom:20px}
.kbd-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:16px;overflow-x:auto}
.kbd-row{display:flex;gap:5px;margin-bottom:5px;flex-wrap:nowrap}
.kbd-key{position:relative;min-width:66px;height:72px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;padding:4px 6px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:all .15s;flex-shrink:0}
.kbd-key:hover{border-color:var(--gold3);background:rgba(200,166,79,.05)}
.kbd-key.has-skill{border-color:var(--skill-border)}
.kbd-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text3);font-weight:500}
.kbd-skill{font-size:8.5px;color:var(--text);line-height:1.2;word-break:break-word;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.kbd-cat{width:100%;height:3px;border-radius:2px;margin-top:2px}
.kbd-key.wide{min-width:80px}
.kbd-key.empty{opacity:.3;cursor:default}
.kbd-key.empty:hover{border-color:var(--border2);background:var(--bg4)}

/* Skills Table */
.skills-table-wrap{margin-bottom:20px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--bg4);padding:8px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;position:sticky;top:0;border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid rgba(37,40,64,.7)}
tbody tr:hover{background:rgba(255,255,255,.025)}
td{padding:8px 12px;vertical-align:middle}
.key-chip{display:inline-block;background:var(--bg4);border:1px solid var(--border2);border-radius:4px;padding:2px 7px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);min-width:32px;text-align:center}
.cat-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:.5px}
.skill-link{color:var(--text);text-decoration:none;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.skill-link:hover{color:var(--gold)}
.skill-link .emo{font-size:14px}
.skill-note{color:var(--text2);font-size:11px}
.type-gcd{background:rgba(45,110,176,.25);color:#70aaee;border:1px solid rgba(45,110,176,.4)}
.type-ogcd{background:rgba(176,112,32,.25);color:#e8b050;border:1px solid rgba(176,112,32,.4)}
.type-role{background:rgba(64,96,64,.25);color:#80b080;border:1px solid rgba(64,96,64,.4)}

/* Category Colors */
.cat-combo{background:rgba(45,110,176,.2);color:#80b8f0;border:1px solid rgba(45,110,176,.3)}
.cat-burst{background:rgba(128,80,32,.2);color:#e8a040;border:1px solid rgba(128,80,32,.3)}
.cat-buff{background:rgba(40,96,64,.2);color:#70d090;border:1px solid rgba(40,96,64,.3)}
.cat-party{background:rgba(32,96,112,.2);color:#60c8d8;border:1px solid rgba(32,96,112,.3)}
.cat-dot{background:rgba(128,48,48,.2);color:#f08080;border:1px solid rgba(128,48,48,.3)}
.cat-move{background:rgba(32,88,120,.2);color:#70aad8;border:1px solid rgba(32,88,120,.3)}
.cat-survival{background:rgba(122,48,32,.2);color:#f09070;border:1px solid rgba(122,48,32,.3)}
.cat-aoe{background:rgba(90,48,144,.2);color:#c090ff;border:1px solid rgba(90,48,144,.3)}
.cat-util{background:rgba(64,72,112,.2);color:#a0a8d8;border:1px solid rgba(64,72,112,.3)}
.cat-song{background:rgba(80,50,110,.2);color:#d080f0;border:1px solid rgba(80,50,110,.3)}

/* Rotation */
.rotation-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:20px}
.rotation-phase{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:14px 16px}
.rotation-phase-name{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--gold);margin-bottom:10px;text-transform:uppercase}
.rotation-steps{list-style:none;display:flex;flex-direction:column;gap:6px}
.rotation-step{font-size:12px;color:var(--text2);padding-left:14px;position:relative;line-height:1.5}
.rotation-step::before{content:'▶';position:absolute;left:0;color:var(--gold3);font-size:8px;top:4px}

/* Ninja Mudra */
.mudra-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:20px}
.mudra-card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.mudra-combo{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--bg4);padding:3px 8px;border-radius:4px;color:var(--gold);letter-spacing:2px;white-space:nowrap}
.mudra-name{font-size:12px;color:var(--text);font-weight:500}
.mudra-note{font-size:10px;color:var(--text2);margin-top:2px}

/* Notice */
.notice{background:rgba(200,166,79,.08);border:1px solid rgba(200,166,79,.25);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--text2);margin-bottom:16px;display:flex;align-items:flex-start;gap:8px}
.notice .icon{color:var(--gold);flex-shrink:0;margin-top:1px}

/* Skill Icons */
.skill-icon{width:28px;height:28px;border-radius:4px;vertical-align:middle;object-fit:cover;background:var(--bg4);flex-shrink:0}
.icon-wrap{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-loading{width:28px;height:28px;border-radius:4px;background:var(--bg4);animation:shimmer 1.2s infinite;flex-shrink:0}
@keyframes shimmer{0%,100%{opacity:.4}50%{opacity:.8}}
.kbd-icon{width:22px;height:22px;border-radius:3px;object-fit:cover;vertical-align:middle;display:block;margin:0 auto 2px}
.kbd-icon-placeholder{width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 2px;font-size:14px}

/* Scrollbars */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--gold3)}

/* Mobile */
@media(max-width:700px){
  .main{flex-direction:column;height:auto}
  .sidebar{width:100%;height:auto;border-right:none;border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap;padding:8px}
  .job-group.active{display:flex;gap:6px;padding:4px}
  .job-btn{white-space:nowrap;flex-shrink:0;border-left:none;border-bottom:2px solid transparent;padding:6px 12px}
  .job-btn.active{border-bottom-color:var(--job-color)}
  .content{padding:14px}
}

/* Cat line colors for keyboard */
.line-combo{background:#3d6eb0}
.line-burst{background:#a06020}
.line-buff{background:#30804a}
.line-party{background:#208060}
.line-dot{background:#a03030}
.line-move{background:#206888}
.line-survival{background:#902a1a}
.line-aoe{background:#703090}
.line-util{background:#505878}
.line-song{background:#70309a}
.line-empty{background:transparent}
</style>
</head>
<body>
<div class="header">
  <div class="header-title">⚔️ FFXIV DPS 가이드</div>
  <div class="header-sub">Dawntrail 7.x · 딜러 13종 기술 & 단축키 레이아웃</div>
</div>

<div class="tabs" id="tabs">
  <div class="tab active melee" data-role="melee">⚔️ 근거리 딜러</div>
  <div class="tab ranged" data-role="ranged">🏹 원거리 물리</div>
  <div class="tab caster" data-role="caster">🔮 마법 딜러</div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content"></div>
</div>

const ALL_KEYS = ['1','2','3','4','5','6','Q','W','E','R','T','A','D','S','F1','F2','F3','F4','S1','S2','S3','S4'];
const KEY_ROWS = [
  ['1','2','3','4','5','6'],
  ['Q','W','E','R','T'],
  ['A','S','D'],
  ['F1','F2','F3','F4','|','S1','S2','S3','S4'],
];

let currentRole = 'melee';
let currentJob = null;

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  const keys = Object.keys(JOBS);
  keys.forEach(role => {
    const grp = document.createElement('div');
    grp.className = `job-group${role===currentRole?' active':''}`;
    grp.id = `jg-${role}`;
    JOBS[role].forEach(job => {
      const btn = document.createElement('button');
      btn.className = `job-btn${currentJob&&currentJob.id===job.id?' active':''}`;
      btn.style.setProperty('--job-color', job.color);
      btn.innerHTML = `<span>${job.emoji}</span><span>${job.kr}</span><span class="job-abbr">${job.abbr}</span>`;
      btn.onclick = () => selectJob(job);
      grp.appendChild(btn);
    });
    sb.appendChild(grp);
  });
}

function renderTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.role===currentRole);
  });
  renderSidebar();
}

function selectRole(role) {
  currentRole = role;
  currentJob = JOBS[role][0];
  renderTabs();
  renderJob();
}

function selectJob(job) {
  currentJob = job;
  renderSidebar();
  renderJob();
}

function badge(type, cat) {
  const t = TYPE[type]||TYPE.G;
  const c = CAT[cat]||CAT.util;
  return `<span class="cat-badge ${t.css}">${t.label}</span> <span class="cat-badge ${c.css}">${c.emoji} ${c.label}</span>`;
}

function renderKeyboard(job) {
  const skillMap = {};
  job.skills.forEach(sk => { skillMap[sk.key] = sk; });

  let html = '<div class="kbd-wrap">';
  KEY_ROWS.forEach(row => {
    html += '<div class="kbd-row">';
    row.forEach(k => {
      if(k==='|'){html += '<div style="width:10px"></div>'; return;}
      const sk = skillMap[k];
      if(!sk){
        html += `<div class="kbd-key empty"><div class="kbd-label">${k}</div><div class="kbd-skill"></div><div class="kbd-cat line-empty"></div></div>`;
        return;
      }
      const cat = CAT[sk.cat]||CAT.util;
      const short = sk.name.length>13 ? sk.name.substring(0,12)+'…' : sk.name;
      html += `<div class="kbd-key has-skill" style="--skill-border:${job.color}44" title="${sk.name} — ${sk.note}">
        <div class="kbd-label">${k}</div>
        <div class="kbd-skill">
          <img class="kbd-icon" data-skill-name="${sk.name}" src="" style="display:none" alt="" onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.style.display='flex')">
          <div class="kbd-icon-placeholder">${cat.emoji}</div>
          <span style="font-size:8px;line-height:1.2;word-break:break-word">${short}</span>
        </div>
        <div class="kbd-cat ${cat.line}"></div>
      </div>`;
    });
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderJob() {
  const job = currentJob;
  if(!job){document.getElementById('content').innerHTML='<p style="color:var(--text2);padding:40px;text-align:center">직업을 선택하세요</p>'; return;}

  const stars = '★'.repeat(job.diff) + '☆'.repeat(5-job.diff);
  let html = `
  <div class="job-panel active">
    <div class="job-header">
      <div>
        <div class="job-name-big" style="color:${job.color}">${job.emoji} ${job.kr} <span style="font-size:14px;color:var(--text2);font-family:'JetBrains Mono',monospace">${job.abbr}</span></div>
        <div class="job-desc">${job.desc}</div>
        <div class="job-meta">
          <span class="badge" style="background:rgba(200,166,79,.15);color:var(--gold);border:1px solid var(--gold3)">난이도 <span class="difficulty-stars">${stars}</span></span>
        </div>
      </div>
      <a class="guide-link" href="${job.guide}" target="_blank" rel="noopener">📖 공식 가이드 →</a>
    </div>

    <div class="notice"><span class="icon">🖼️</span>기술 아이콘은 <b>xivapi.com</b>에서 자동으로 불러옴. 처음 열면 잠깐 로딩 시간이 있어. 기술명 클릭 시 Garland Tools로 이동.</div>

    <div class="section-title">핵심 메카닉</div>
    <div class="mechanics-grid">`;

  job.mechanics.forEach(m => {
    html += `<div class="mechanic-card"><div class="mechanic-name">${m.name}</div><div class="mechanic-desc">${m.desc}</div></div>`;
  });
  html += `</div>`;

  // 닌자 무드라 섹션
  if(job.mudra){
    html += `<div class="section-title">무드라 인술 조합 (Q=Ten / W=Chi / E=Jin)</div><div class="mudra-grid">`;
    job.mudra.forEach(m => {
      html += `<div class="mudra-card"><div class="mudra-combo">${m.combo}</div><div><div class="mudra-name">${m.name}</div><div class="mudra-note">${m.note}</div></div></div>`;
    });
    html += `</div>`;
  }

  // 키보드 레이아웃
  html += `<div class="kbd-section"><div class="section-title">단축키 레이아웃</div>${renderKeyboard(job)}</div>`;

  // 스킬 테이블
  html += `<div class="section-title">기술 목록</div><div class="skills-table-wrap"><table>
    <thead><tr><th>키</th><th>기술명</th><th>유형</th><th>설명</th></tr></thead><tbody>`;
  job.skills.forEach(sk => {
    const c = CAT[sk.cat]||CAT.util;
    html += `<tr>
      <td><span class="key-chip">${sk.key}</span></td>
      <td><a class="skill-link" href="${sk.gt}" target="_blank" rel="noopener">
        <span class="icon-wrap">
          <img class="skill-icon" data-skill-name="${sk.name}" src="" style="display:none" alt="${sk.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.style.display='inline')">
          <span class="icon-placeholder emo" style="display:inline">${c.emoji}</span>
        </span>
        ${sk.name}
      </a></td>
      <td>${badge(sk.type, sk.cat)}</td>
      <td class="skill-note">${sk.note}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;

  // 로테이션
  html += `<div class="section-title">로테이션 흐름</div><div class="rotation-wrap">`;
  job.rotation.forEach(r => {
    html += `<div class="rotation-phase"><div class="rotation-phase-name">${r.phase}</div><ul class="rotation-steps">`;
    r.steps.forEach(step => { html += `<li class="rotation-step">${step}</li>`; });
    html += `</ul></div>`;
  });
  html += `</div></div>`;

  document.getElementById('content').innerHTML = html;
}

// ─────────────── XIVAPI Icon Loader ───────────────
// GitHub Pages / 로컬 파일에서 열 때만 동작
// API: https://xivapi.com/search?indexes=Action&string=XXX&language=en&limit=1
const iconCache = {};

async function fetchIconUrl(skillName) {
  const key = skillName.trim().toLowerCase();
  if (iconCache[key] !== undefined) return iconCache[key];
  iconCache[key] = null; // 로딩 중 표시
  try {
    const clean = skillName
      .replace(/\s*\(.*?\)\s*/g,'')   // 괄호 제거
      .replace(/\s*\/\s*.+$/,'')       // / 뒤 제거
      .replace(/[★☆]/g,'')            // 특수문자 제거
      .trim();
    const url = `https://xivapi.com/search?indexes=Action&string=${encodeURIComponent(clean)}&language=en&limit=3`;
    const res = await fetch(url, {signal: AbortSignal.timeout(6000)});
    if (!res.ok) return null;
    const data = await res.json();
    if (data.Results && data.Results.length > 0) {
      // 정확도 높은 결과 우선 (이름 일치 체크)
      const exact = data.Results.find(r => r.Name && r.Name.toLowerCase() === clean.toLowerCase());
      const best = exact || data.Results[0];
      if (best.Icon) {
        const imgUrl = 'https://xivapi.com' + best.Icon;
        iconCache[key] = imgUrl;
        return imgUrl;
      }
    }
  } catch(e) {}
  iconCache[key] = null;
  return null;
}

// img 태그 업데이트 (data-skill-name 속성 기반)
async function loadAllIcons() {
  const imgs = document.querySelectorAll('img[data-skill-name]');
  const promises = Array.from(imgs).map(async (img) => {
    if (img.dataset.loaded) return;
    const name = img.dataset.skillName;
    const url = await fetchIconUrl(name);
    if (url) {
      img.src = url;
      img.dataset.loaded = '1';
      img.style.display = 'inline-block';
      const placeholder = img.parentElement.querySelector('.icon-placeholder');
      if (placeholder) placeholder.style.display = 'none';
    } else {
      const placeholder = img.parentElement.querySelector('.icon-placeholder');
      if (placeholder) placeholder.style.display = 'inline';
      img.style.display = 'none';
    }
  });
  await Promise.all(promises);
}

// renderJob 후에 아이콘 로드 트리거
const _origRenderJob = renderJob;
window.renderJob = async function() {
  _origRenderJob();
  // 약간 딜레이 후 DOM 렌더링 완료되면 아이콘 로드
  setTimeout(loadAllIcons, 100);
};
// 최초 실행 시에도 적용
setTimeout(loadAllIcons, 300);
